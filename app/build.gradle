plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bubblepop.arena'
    compileSdk 34

    defaultConfig {
        applicationId 'com.bubblepop.arena'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.10.0'
}
